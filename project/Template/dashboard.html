<!DOCTYPE html>
<html lang="en">
<head>
<title>Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#003c8f;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#0d47a1;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
}

table{
    width:90%;
    margin:auto;
    margin-top:30px;
    border-collapse:collapse;
    background:white;
}

th, td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#003c8f;
    color:white;
}

</style>

</head>

<body>

<header>
<h1>Hotel Dashboard</h1>
</header>

<nav>
<a href="{% url 'home' %}">Home</a>
<a href="{% url 'rooms' %}">Rooms</a>
<a href="{% url 'bookings' %}">Bookings</a>
<a href="{% url 'dashboard' %}">Dashboard</a>
</nav>

<table>

<tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Room Type</th>
    <th>Days</th>
    <th>Members</th>
</tr>

{% for b in bookings %}

<tr>
    <td>{{ b.name }}</td>
    <td>{{ b.phone }}</td>
    <td>{{ b.email }}</td>
    <td>{{ b.room_type }}</td>
    <td>{{ b.days }}</td>
    <td>{{ b.members }}</td>


    <td>

        <a href="{% url 'edit_Booking' b.id %}">
            <button class="edit">Edit</button>
        </a>
<!--    <td>-->
<!--    {% if b.image %}-->
<!--    <img src="{{b.image.url }}" width="100">-->
<!--    {% else %}-->
<!--&lt;!&ndash;        no img&ndash;&gt;-->
<!--    {% endif %}-->
<!--</td>-->
<td>
        <a href="{% url 'delete_Booking' b.id %}">
            <button class="delete">Delete</button>
            <a href="{% url 'single_Booking' b.id %}">
                <button class="view">View</button>
            </a>

        </a>

    </td>

</tr>


{% endfor %}

</table>

</body>
</html>
