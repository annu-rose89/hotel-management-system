
<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<title>Rooms</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#003c8f;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#0d47a1;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}

nav a:hover{
    text-decoration:underline;
}

.room-container{
    display:flex;
    justify-content:center;
    gap:30px;
    margin-top:50px;
    flex-wrap:wrap;
    transform: translateY(10px);
}

.room-card{
    background:white;
    width:300px;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px lightgray;
    text-align:center;
     transition:transform 0.4s ease;
}

.room-card:hover{
            transform:translateY(-15px);
        }
.room-card img{
    width:100%;
    height:200px;
    border-radius:10px;
}

button{
    background:green;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<header>
<h1>Moonstone Hotel Rooms</h1>
</header>


<nav>
    <a href="{% url 'home' %}">Home</a>
<!--    <a href="{% url 'about' %}">About</a>-->
<!--    <a href="{% url 'rooms' %}">Rooms</a>-->
<!--    <a href="{% url 'services' %}">Services</a>-->
<!--    <a href="{% url 'gallery' %}">Gallery</a>-->
<!--    <a href="{% url 'bookings' %}">Bookings</a>-->
<!--    <a href="{% url 'contact' %}">Contact</a>-->
</nav>

<!-- ROOMS SECTION -->
<div class="room-container">

    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85">
        <h2>Deluxe Room</h2>
        <p>Luxury room with WiFi, AC and breakfast.</p>
        <h3>₹4500/Night</h3>

        <a href="{% url 'bookings' %}">
            <button>Book Now</button>
        </a>
    </div>

    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a">
        <h2>Suite Room</h2>
        <p>Premium suite with pool view.</p>
        <h3>₹8000/Night</h3>

        <a href="{% url 'bookings' %}">
            <button>Book Now</button>
        </a>
    </div>

    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267">
        <h2>Single Room</h2>
        <p>Comfortable stay for one person.</p>
        <h3>₹2500/Night</h3>

        <a href="{% url 'bookings' %}">
            <button>Book Now</button>
        </a>
    </div>

</div>

</body>
</html>
