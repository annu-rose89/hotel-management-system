<h2>Edit Booking</h2>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ booking.name }}"><br><br>
    <label>Phone:</label>
    <input type="text" name="phone" value="{{ booking.phone }}"><br><br>
    <label>Email:</label>
    <input type="email" name="email" value="{{ booking.email }}"><br><br>
    <label>Address:</label>
    <input type="text" name="address" value="{{ booking.address }}"><br><br>
    <label>Days:</label>
    <input type="number" name="days" value="{{ booking.days }}"><br><br>
    <label>Members:</label>
    <input type="number" name="members" value="{{ booking.members }}"><br><br>


    <button type="submit">Update</button>
</form>
</body>
</html>
