<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Login</title>
      <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
<div class="login-box">

    <h1> Moonstone Hotel</h1>

    <form method="POST">

        {% csrf_token %}

        <input type="text" placeholder="Username" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
