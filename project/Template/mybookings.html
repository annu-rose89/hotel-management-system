<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<title>My Bookings</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

header{
    background:#003c8f;
    color:white;
    padding:20px;
    text-align:center;
}

.booking-box{
width:80%;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid gray;
padding:15px;
text-align:center;
}
nav{
    background:#0d47a1;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}

nav a:hover{
    text-decoration:underline;
}
</style>

</head>
<body>
<header>
<h1>Moonstone Hotel Rooms</h1>
</header>
<nav>

  <a href="{% url 'home' %}">Home</a>
</nav>

<div class="booking-box">

<h1>My Bookings</h1>

<table>

<tr>
<th>Room</th>
<th>Check In</th>
<th>Check Out</th>
<th>Status</th>
</tr>

<tr>
<td>Deluxe Room</td>
<td>20-05-2026</td>
<td>22-05-2026</td>
<td>Confirmed</td>
</tr>

</table>

</div>

</body>
</html>
