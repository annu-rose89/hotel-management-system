
<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
<title>Bookings</title>

<style>

body{
    font-family:Arial;
    background:#f4f4f4;
}

header{
    background:#003c8f;
    color:white;
    padding:20px;
    text-align:center;
}

.form-box{
    width:400px;
    margin:auto;
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:10px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    margin-top:15px;
    cursor:pointer;
}

nav a{
    margin-right:10px;
}
nav{
    background:#0d47a1;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-size:18px;
}

nav a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<header>
<h1>Moonstone Hotel Rooms</h1>
</header>
<nav>
    <a href="{% url 'home' %}">Home</a>
<!--    <a href="/about/">About</a>-->
<!--    <a href="/rooms/">Rooms</a>-->
<!--    <a href="/services/">Services</a>-->
<!--    <a href="/gallery/">Gallery</a>-->
<!--    <a href="/bookings/">Bookings</a>-->
<!--    <a href="/contact/">Contact</a>-->
</nav>

<div class="form-box">

<h1>Room Booking</h1>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Customer Name" required>

    <input type="text" name="phone" placeholder="Phone Number" required>

    <input type="email" name="email" placeholder="Email" required>

    <textarea name="address" placeholder="Address" required></textarea>

    <input type="number" name="members" placeholder="No of Members" required>

    <input type="number" name="days" placeholder="No of Days" required>

    <select name="room_type">
        <option value="Single Room">Single Room</option>
        <option value="Deluxe Room">Deluxe Room</option>
        <option value="Suite Room">Suite Room</option>
    </select>

    <select name="gender">
        <option>Male</option>
        <option>Female</option>
    </select>

    <select name="payment_method">
        <option>Cash</option>
        <option>Card</option>
        <option>UPI</option>
    </select>


    <button type="submit">Confirm Booking</button>

</form>

</div>

</body>
</html>
